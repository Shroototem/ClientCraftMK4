plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

group = maven_group
version = mod_version + "+" + stonecutter.current.version

base {
    archivesName = "${archives_base_name}"
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "maven.modrinth:mOgUt4GM:njXb639R"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// ~X.Y- : allows snapshots of X.Y and blocks newer minors (e.g. 26.3-snapshot-7 -> "~26.3-")
def mcPredicate = {
    def parts = stonecutter.current.version.toString().replaceAll(/-snapshot.*$/, '').tokenize('.')
    return "~" + parts[0..Math.min(1, parts.size() - 1)].join('.') + "-"
}()

processResources {
    inputs.property "version", version
    inputs.property "mc_version", stonecutter.current.version
    inputs.property "mc_predicate", mcPredicate
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": version,
               "mc_version": stonecutter.current.version,
               "mc_predicate": mcPredicate
    }
}

java {
    if (providers.gradleProperty("clientcraft.sourcesJar").getOrElse("false") == "true") {
        withSourcesJar()
    }
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
