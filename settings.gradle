pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.7.10'
}

rootProject.name = "clientcraftmk4"

stonecutter {
    kotlinController = false
    centralScript = "build.gradle"
    create(rootProject) {
        // '26.4-snapshot-3' is live now that Fabric ships 0.162.2+26.4 (the +26.4 builds
        // map onto snapshots 1:1). Versions live in versions/<ver>/gradle.properties.
        versions '26.4-snapshot-3', '26.3', '26.2', '26.1.2'
        vcsVersion = '26.3'
    }
}
