pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.7.10'
}

rootProject.name = "clientcraftmk4"

stonecutter {
    kotlinController = false
    centralScript = "build.gradle"
    create(rootProject) {
        // '26.4-snapshot-1' parked until Fabric ships a +26.4 build (poisons all
        // Gradle invocations while unresolvable). Prep stub lives in
        // versions/26.4-snapshot-1/gradle.properties — just uncomment below.
        versions /* '26.4-snapshot-1', */ '26.3', '26.2', '26.1.2'
        vcsVersion = '26.3'
    }
}
